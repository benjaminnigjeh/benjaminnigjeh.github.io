- id: proteobio
  category: proteobio
  category_label: ProteoBio
  org: ProteoBio, Inc.
  title: Chief Machine Learning Scientist
  start: "December 2025"
  end: "Present"
  summary: >-
    Lead scientific strategy and technical development of AI/ML technologies
    for ProteoBio's AI-native computational proteomics platform. Architect
    and principal developer of ProteoAgent Server, a multi-agent system
    unifying machine learning, bioinformatics, LLMs, and classical mass
    spectrometry algorithms to automate proteomics and proteoform analysis.
  highlights:
    - Architected the full ProteoAgent Server platform — supervisor orchestration, expert AI agents, workflow planning, persistent memory, reporting, cloud deployment, and interactive UI.
    - Designed ML frameworks spanning the full computational proteomics workflow — knowledge harvesting, automated dataset generation/labeling, MS signal processing, isotope deconvolution, proteoform feature discovery, protein identification, proteoform characterization, quantitative proteomics.
    - Developed the ProteoFormer Pipeline, an elastic containerized framework integrating deep learning, probabilistic inference, graph-based algorithms, and established bioinformatics toolkits into reproducible scientific workflows.
    - Built automated knowledge-harvesting infrastructure for collecting, normalizing, and annotating large-scale proteomics datasets and literature to generate ML training data.
    - Led development of the alpha release of ProteoAgent Server — automated mzML QC, protein identification, quantitative analysis, integrated reporting, multi-agent scientific reasoning.

- id: northwestern
  category: northwestern
  category_label: Northwestern
  org: Northwestern University, Proteomics Center of Excellence
  title: AI/ML Lead Scientist
  start: "March 2024"
  end: "Present"
  summary: >-
    Lead the design and application of AI, machine learning, and
    computational methods for top-down proteomics, proteoform informatics,
    and large-scale mass spectrometry data analysis.
  highlights:
    - Established and led the Artificial Intelligence and Machine Learning Study Group — benchmarking classical ML, deep learning, protein language models, graph-based learning, foundation models, and LLMs for proteomics.
    - Designed computational algorithms for proteoform discovery, integrating consecutive MS1 scans, isotope envelopes, precursor ions, chromatographic evidence, and MS/MS identifications.
    - Developed IDNet, a deep-learning framework for MS/MS spectrum identification using contrastive learning, embedding representations, and protein language models.
    - Designed Graph-Based Proteoform Inference (GPI) algorithms integrating evidence across consecutive MS1 scans and MS/MS spectra to improve proteoform reconstruction and assignment confidence.
    - Led computational analysis of large-scale top-down proteomics studies in neurodegeneration, plasma proteomics, and clinical biomarker discovery.

