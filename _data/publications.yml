- id: research-1
  status: Research Manuscript
  title: Variational Autoencoders for Quantitative Proteomic Data Compression and Inference
  context: Bioinformatics
  source_title: >-
    Variable Autoencoders in the Unsupervised Data Compression and Inference
    from Discovery-based Quantitative Proteomic Datasets
  summary: >-
    Developed a fully connected variational autoencoder for nonlinear
    dimensionality reduction, visualization, clustering, and inference from
    high-dimensional quantitative proteomic datasets. The model compressed
    thousands of protein measurements into a two-dimensional latent
    representation and was evaluated using synthetic datasets, TMT
    pancreatic tissue proteomics, and multi-study Super-SILAC breast cancer
    proteomics.
  highlights:
    - 10-plex TMT pancreatic tissue dataset — 54 samples, 7,699 quantified proteins
    - Unsupervised separation of pancreatic cancer tissue from healthy controls
    - Successful latent-space inference of unseen test cancer samples
    - Super-SILAC breast tissue analysis — 242 samples, 6,703 quantified proteins
    - Combined dataset spanned three separately published studies
    - Study-specific clustering demonstrated the impact of experimental design and batch effects
  tags: [Variational Autoencoder, Unsupervised Learning, TensorFlow, Keras, TMT Proteomics, Super-SILAC, Latent-Space Inference, Dimensionality Reduction]
  filter_tags: [ai, ml, proteomics, mass-spectrometry]
  technical_details: >-
    A fully connected encoder/decoder was benchmarked against a convolutional
    variant and selected for training speed and comparable clustering quality
    (k-means silhouette score). Training behavior was first characterized on
    synthetic and partial MNIST datasets — measuring Euclidean distance
    between latent-space cluster centers — to study how data quantity and
    feature quality affect compression before applying the model to the
    pancreatic and breast tissue proteomic datasets.
  pdf: vae-quantitative-proteomics.pdf

- id: research-2
  status: Research Manuscript
  title: Machine Learning for Early-Stage Pancreatic Cancer Detection from Plasma Proteomics
  context: PROTEOMICS
  source_title: >-
    Data-Independent Acquisition Mass Spectrometry and Machine Learning
    Algorithms in the Early-Stage Diagnosis of Pancreatic Cancer from
    Clinical Plasma Samples
  summary: >-
    Developed and benchmarked neural-network and classical machine-learning
    models for classification of early-stage pancreatic ductal
    adenocarcinoma using quantitative plasma proteomics generated by
    data-independent acquisition mass spectrometry.
  highlights:
    - 38 total clinical plasma samples — 19 early-stage pancreatic cancer vs. 19 healthy controls
    - 1,898 quantified plasma proteins across 10,871 unique peptides
    - Balanced 28-sample training cohort with an independent 10-sample hold-out test set
    - Neural network optimized with k-fold and leave-one-out cross-validation plus early-stopping regularization
    - Benchmarked against logistic regression, random forest, and multinomial naïve Bayes
    - 58 differentially quantified proteins, associated mainly with immune-response and metabolic processes
  tags: [DIA-MS, Clinical Proteomics, Neural Networks, Machine Learning, Skyline, Cross-Validation, ROC Analysis, Pancreatic Cancer]
  filter_tags: [ai, ml, proteomics, mass-spectrometry]
  technical_details: >-
    Network architecture (node counts per hidden layer) was tuned via a
    keras-tuner k-fold search on the training cohort. Training length was set
    using a leave-one-out evaluation-loss curve, and prediction accuracy on
    the hold-out test cohort was compared across activation functions (ReLU,
    ELU, SELU, Tanh) and optimizers (Adam, Nadam, Adamax, RMSProp, SGD,
    Adagrad, Adadelta, Ftrl) before benchmarking against classical
    machine-learning baselines using ROC/AUC.
  pdf: dia-pancreatic-cancer-machine-learning.pdf

- id: research-3
  status: Research Manuscript
  title: Self-Supervised Proteomics with VAE-Based Compression and Density-Based Clustering
  context: Analytical Chemistry
  source_title: >-
    Fully Connected Self-Supervised Deep Learners in Data-Driven Mass
    Spectrometry Proteomics
  summary: >-
    Designed a self-supervised proteomics workflow that combines a fully
    connected variational autoencoder with density-based clustering to
    compress proteomic datasets, discover sample groups, generate labels,
    and support downstream supervised classifiers.
  highlights:
    - "Full pipeline: mzML conversion → Comet database search → PeptideProphet / Trans-Proteomic Pipeline → Skyline quantification"
    - Fully connected variational autoencoder for 2-D latent-space dimensionality reduction
    - DBSCAN-based automated clustering, benchmarked against k-means, agglomerative, spectral clustering, and affinity propagation
    - Evaluated across 4 proteomic sample types — whole-tissue lysates, SCX fractions, immunoprecipitated samples, excised gel bands
    - DBSCAN epsilon hyperparameter optimized using homogeneity, completeness, and V-measure
    - Labeled tuning samples used to calibrate clustering ahead of downstream supervised classifiers
  tags: [Self-Supervised Learning, VAE, DBSCAN, Comet, Trans-Proteomic Pipeline, Skyline, mzML, Automated Labeling]
  filter_tags: [ai, ml, proteomics, mass-spectrometry, software]
  technical_details: >-
    DBSCAN's epsilon parameter was swept and scored by homogeneity,
    completeness, and their harmonic mean (V-measure) on synthetic noise
    datasets and on four real proteomic sample-type groups, establishing a
    tune-sample-based calibration strategy for automated cluster labeling
    ahead of downstream supervised classifiers such as fully connected
    neural network classifiers.
  pdf: self-supervised-proteomics.pdf
