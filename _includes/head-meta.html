{%- assign page_title = page.title | default: site.title -%}
{%- assign page_description = page.description | default: site.description -%}
{%- assign og_image = '/assets/images/og-image.png' | absolute_url -%}

<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:site_name" content="{{ site.title }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ og_image }}">

<meta name="theme-color" content="#0a0e17">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author | jsonify }},
  "email": "mailto:{{ site.email }}",
  "jobTitle": {{ site.data.profile.role | jsonify }},
  "url": {{ site.url | jsonify }},
  "sameAs": [
    {%- assign socials = "" | split: "" -%}
    {%- if site.data.profile.github != "" %}{% assign socials = socials | push: site.data.profile.github %}{% endif -%}
    {%- if site.data.profile.linkedin != "" %}{% assign socials = socials | push: site.data.profile.linkedin %}{% endif -%}
    {%- if site.data.profile.scholar != "" %}{% assign socials = socials | push: site.data.profile.scholar %}{% endif -%}
    {%- if site.data.profile.orcid != "" %}{% assign socials = socials | push: site.data.profile.orcid %}{% endif -%}
    {%- for s in socials -%}{{ s | jsonify }}{% unless forloop.last %},{% endunless %}{%- endfor -%}
  ],
  "knowsAbout": ["Artificial Intelligence", "Machine Learning", "Computational Proteomics", "Mass Spectrometry", "Bioinformatics", "Multi-Agent Systems", "Large Language Models"]
}
</script>
