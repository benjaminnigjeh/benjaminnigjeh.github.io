<div class="command-palette" id="command-palette" role="dialog" aria-modal="true" aria-label="Command palette" hidden>
  <div class="command-palette-backdrop" data-palette-close></div>
  <div class="command-palette-panel glass">
    <input type="text" id="palette-input" class="command-palette-input" placeholder="Jump to a section or page…" autocomplete="off" aria-label="Search sections and pages">
    <ul class="command-palette-results" id="palette-results" role="listbox"></ul>
    <div class="command-palette-hint">↑↓ to navigate · Enter to go · Esc to close</div>
  </div>
</div>
